<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOOTBALL TODAY</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f6f6f4;color:#171717;font-family:Arial,"Noto Sans JP",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-size:20px;font-weight:800;letter-spacing:.04em}
.sub{font-size:12px;color:#777}
.datebar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.date{font-size:24px;font-weight:800;text-align:center}
.nav{border:0;background:transparent;font-size:14px;cursor:pointer;color:#555;padding:8px}
.filters{display:flex;gap:8px;margin-bottom:22px}
.filter{flex:1;border:1px solid #ddd;background:#fff;border-radius:10px;padding:11px;cursor:pointer;font-weight:700}
.filter.active{background:#171717;color:#fff;border-color:#171717}
.league{margin:22px 0}
.league-title{font-size:13px;font-weight:800;color:#666;margin:0 0 8px;padding-left:2px}
.match{background:#fff;border:1px solid #e5e5e5;border-radius:13px;padding:15px;margin-bottom:8px;display:grid;grid-template-columns:68px 1fr 1fr;gap:12px;align-items:center}
.time{font-size:16px;font-weight:800;align-self:start;padding-top:4px}
.team{text-align:center;font-size:14px;line-height:1.35}.league-tag{display:block;font-size:9px;color:#999;font-weight:600;margin-bottom:5px}
.team.japan{font-weight:800}
.jp{display:block;font-size:11px;color:#16734a;margin-top:4px}
.vs{text-align:center;color:#aaa;font-size:11px;display:none}
.empty{background:#fff;border:1px dashed #ddd;border-radius:13px;padding:30px;text-align:center;color:#777}
.note{font-size:11px;color:#888;line-height:1.7;margin-top:24px}
@media(max-width:560px){
 .wrap{padding:20px 12px 45px}.date{font-size:21px}
 .match{grid-template-columns:58px 1fr 1fr;padding:13px 10px;gap:6px}
 .team{font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
<header><div><div class="logo">FOOTBALL TODAY</div><div class="sub">海外サッカーを日本時間で</div></div><div class="sub">🇯🇵 日本人選手</div></header>

<div class="datebar">
<button class="nav" id="prev">← 前日</button>
<div class="date" id="date"></div>
<button class="nav" id="next">翌日 →</button>
</div>

<div class="filters">
<button class="filter active" data-filter="all">すべて</button>
<button class="filter" data-filter="jp">🇯🇵 日本人所属</button>
</div>

<main id="matches"></main>

<div class="note">※ このサイトはネタバレ防止のため、スコア・勝敗・試合結果は表示しません。試合日時や所属は変更される場合があります。</div>
</div>
<script>
const leagues=[
 {name:"🇬🇧 Premier League", games:[
  {time:"19:30",home:"ブライトン",homeJp:["三笘薫"],away:"マンチェスター・ユナイテッド"},
  {time:"22:00",home:"リヴァプール",away:"アーセナル"}]},
 {name:"🇪🇸 La Liga", games:[
  {time:"25:00",home:"レアル・マドリード",away:"バルセロナ"},
  {time:"28:00",home:"レアル・ソシエダ",homeJp:["久保建英"],away:"ビジャレアル"}]},
 {name:"🇮🇹 Serie A", games:[
  {time:"25:30",home:"インテル",away:"ミラン"},
  {time:"28:45",home:"パルマ",homeJp:["鈴木彩艶"],away:"ローマ"}]},
 {name:"🇩🇪 Bundesliga", games:[
  {time:"25:30",home:"フランクフルト",homeJp:["堂安律"],away:"ドルトムント"},
  {time:"28:30",home:"バイエルン",away:"レヴァークーゼン"}]},
 {name:"🇫🇷 Ligue 1", games:[
  {time:"27:00",home:"モナコ",away:"リヨン"}]},
 {name:"🇳🇱 Eredivisie", games:[
  {time:"24:00",home:"フェイエノールト",away:"アヤックス"},
  {time:"27:00",home:"PSVアイントホーフェン",away:"ユトレヒト"}]},
 {name:"🇧🇪 Belgian Pro League", games:[
  {time:"25:15",home:"ヘンク",homeJp:["伊東純也"],away:"アンデルレヒト"}]},
 {name:"🇪🇺 UEFA Champions League", games:[]},
 {name:"🇪🇺 UEFA Europa League", games:[]}
];

let day=new Date(); let filter="all";
const jpOf=g=>g.homeJp||g.awayJp;
function fmt(d){return `${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`}
function render(){
 document.getElementById("date").textContent=fmt(day);
 const main=document.getElementById("matches"); main.innerHTML="";
 let games=[];
 leagues.forEach(l=>{
  l.games.forEach(g=>{
   if(filter==="all" || jpOf(g)) games.push({...g, league:l.name});
  });
 });
 const toMinutes=t=>{
  const [h,m]=t.split(":").map(Number);
  return h*60+m;
 };
 games.sort((a,b)=>toMinutes(a.time)-toMinutes(b.time));

 if(!games.length){
  main.innerHTML='<div class="empty">この日の対象試合はありません。</div>';
  return;
 }

 games.forEach(g=>{
  const hjp=g.homeJp?.length, ajp=g.awayJp?.length;
  const card=document.createElement("div"); card.className="match";
  card.innerHTML=`<div class="time">${g.time}</div>
   <div class="team ${hjp?'japan':''}">
    <span class="league-tag">${g.league}</span>
    ${hjp?'🇯🇵 ':''}${g.home}
    ${hjp?`<span class="jp">${g.homeJp.join("・")}</span>`:""}
   </div>
   <div class="team ${ajp?'japan':''}">
    <span class="league-tag">${g.league}</span>
    ${ajp?'🇯🇵 ':''}${g.away}
    ${ajp?`<span class="jp">${g.awayJp.join("・")}</span>`:""}
   </div>`;
  main.appendChild(card);
 });
}
document.getElementById("prev").onclick=()=>{day.setDate(day.getDate()-1);render()}
document.getElementById("next").onclick=()=>{day.setDate(day.getDate()+1);render()}
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
 b.classList.add("active"); filter=b.dataset.filter; render();
});
render();
</script>
</body>
</html>
