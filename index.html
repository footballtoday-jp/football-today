<html lang="ja">
<head>
<meta charset="utf-8">

<title>FOOTBALL TODAY</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#f6f6f4;
  color:#171717;
  font-family:Arial,"Noto Sans JP",sans-serif;
}

body{

}

.wrap{

  max-width:1500px;
  margin:0 auto;
  padding:18px 14px 40px;
}

/* =========================
   HEADER
========================= */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.logo{
  font-size:21px;
  font-weight:800;

/* =========================
   DATE

.datebar{
  display:grid;
  grid-template-columns:100px 1fr 100px;
  align-items:center;
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;

.nav{

  font-size:13px;
  cursor:pointer;
  color:#555;
  padding:7px;
}

.nav:last-child{
  text-align:right;
}

/* =========================
   FILTER

.filters{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;

}

.filter{
  border:1px solid #d8d8d8;

  table-layout:fixed;

  border:1px solid #ccc;

  width:115px;

  border-top:2px solid #bdbdbd;
}

  border-top:1px solid #cfcfcf;

/* =========================
   MOBILE CARD
========================= */

.mobile-list{
  display:none;
}

.mobile-day{
  margin-top:12px;
}

.mobile-day-title{
  font-size:13px;
  font-weight:800;
  padding:5px 4px;
  border-bottom:1px solid #d0d0d0;
}

.mobile-league{
  margin-top:7px;
}

.mobile-league-title{
  font-size:9px;
  color:#777;
  font-weight:700;
  padding:3px 4px;
}

.mobile-match{
  background:#fff;
  border:1px solid #ddd;
  border-radius:9px;
  margin-bottom:5px;

}

.mobile-time{
  font-size:12px;

}

/* =========================
   EMPTY / NOTE
========================= */

.empty{
  background:#fff;
  border:1px dashed #ccc;
  border-radius:10px;
  padding:25px 15px;
  text-align:center;
  color:#777;
  font-size:12px;
}

.note{
  font-size:10px;
  color:#777;
  line-height:1.6;
  margin-top:18px;
}

.status{
  text-align:center;
  color:#777;
  padding:25px 10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .wrap{
    padding:10px 8px 25px;
  }

  header{
    margin-bottom:8px;
  }

  .logo{
    font-size:17px;
  }

  .sub{
    font-size:9px;
  }

  .datebar{
    grid-template-columns:60px 1fr 60px;
    padding:6px 7px;
    margin-bottom:8px;
    border-radius:10px;
  }

  .date{
    font-size:18px;
    white-space:nowrap;
  }

  .nav{
    font-size:11px;
    padding:5px 2px;
  }

  .filters{
    gap:5px;
    margin-bottom:9px;
  }

  .filter{
    padding:8px 3px;
    font-size:10px;
    border-radius:8px;
  }

  /* PC tableをスマホでは隠す */
  .schedule-table{
    display:none;
  }

  /* スマホはカード表示 */
  .mobile-list{
    display:block;
  }

  .note{
    font-size:9px;
    margin-top:12px;
  }
}

/* =========================
   VERY SMALL PHONE
========================= */

@media(max-width:380px){

  .date{
    font-size:16px;
  }

  .nav{
    font-size:10px;
  }

  .mobile-team{
    font-size:10px;
  }

  .mobile-jp{
    font-size:8px;
  }

  .filter{
    font-size:9px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div>
    <div class="logo">FOOTBALL TODAY</div>
    <div class="sub">海外サッカーを日本時間で</div>
  </div>
  <div class="sub">JP 日本人選手</div>
</header>

<div class="datebar">
  <button class="nav" id="prev">← 前日</button>
  <div class="date" id="date">読み込み中</div>
  <button class="nav" id="next">翌日 →</button>
</div>

<div class="filters">
  <button class="filter active" data-filter="all">すべて</button>
  <button class="filter" data-filter="jp">JP 日本人所属</button>
  <button class="filter" data-view="simple">簡素表示</button>
</div>

<main id="matches">
  <div class="status">試合日程を読み込んでいます…</div>
</main>

<div class="note">
  ※ このサイトはネタバレ防止のため、スコア・勝敗・試合結果は表示しません。
  試合日時や所属は変更される場合があります。
</div>

</div>

<script>

let allMatches = [];
let day = new Date();
let filter = "all";
let viewMode = "normal";

const dayNames = ["日","月","火","水","木","金","土"];

/* =========================
   DATE FUNCTIONS
========================= */

function formatDate(d){
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${dayNames[d.getDay()]}）`;
}

function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

/*
  25:00 → 01:00 のような表記が
  データに残っている場合も表示上は統一
*/
function displayTime(time){

  if(!time) return "";

  const match = String(time).match(/^(\d{1,2}):(\d{2})$/);

  if(!match){
    return time;
  }

  let hour = Number(match[1]);
  const minute = match[2];

  if(hour >= 24){
    hour = hour - 24;
  }

  return `${String(hour).padStart(2,"0")}:${minute}`;
}

/* =========================
   MAIN RENDER
========================= */

function render(){

  document.getElementById("date").textContent = formatDate(day);

  const key = dateKey(day);
  const main = document.getElementById("matches");

  let games = allMatches.filter(
    m => m.dateJst === key
  );

  if(filter === "jp"){

    games = games.filter(m =>
      (m.homeJp && m.homeJp.length) ||
      (m.awayJp && m.awayJp.length)
    );

  }

  games.sort((a,b) =>
    String(a.timeJst || "").localeCompare(
      String(b.timeJst || "")
    )
  );

  if(!games.length){

    main.innerHTML =
      '<div class="empty">この日の対象試合はありません。</div>';

    return;
  }

  renderDesktop(games);
  renderMobile(games);
}

/* =========================
   DESKTOP
========================= */

function renderDesktop(games){

  const main = document.getElementById("matches");

  const table = document.createElement("table");
  table.className = "schedule-table";

  table.innerHTML = `
    <thead>
      <tr>
        <th class="date-col">日付</th>
        <th class="time-col">時刻</th>
        <th class="league-col">リーグ</th>
        <th>ホーム</th>
        <th class="jp-col">日本人</th>
        <th>アウェイ</th>
        <th class="jp-col">日本人</th>
      </tr>
    </thead>
  `;

  const tbody = document.createElement("tbody");

  let previousDate = "";
  let previousLeague = "";

  games.forEach(g => {

    const tr = document.createElement("tr");

    if(g.dateJst !== previousDate){
      tr.classList.add("day-start");
      previousDate = g.dateJst;
      previousLeague = "";
    }

    if(g.league !== previousLeague){
      tr.classList.add("league-start");
      previousLeague = g.league;
    }

    const homeJp =
      g.homeJp && g.homeJp.length
        ? g.homeJp.join("・")
        : "";

    const awayJp =
      g.awayJp && g.awayJp.length
        ? g.awayJp.join("・")
        : "";

    tr.innerHTML = `
      <td class="date-col">
        ${g.dateJst === previousDate
          ? formatTableDate(g.dateJst)
          : ""}
      </td>

      <td class="time-col">
        ${displayTime(g.timeJst)}
      </td>

      <td class="league-col">
        ${g.league || "その他"}
      </td>

      <td class="team-col">
        ${g.homeNameJa || ""}
      </td>

      <td class="jp-col">
        ${homeJp}
      </td>

      <td class="team-col">
        ${g.awayNameJa || ""}
      </td>

      <td class="jp-col">
        ${awayJp}
      </td>
    `;

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);

  main.innerHTML = "";
  main.appendChild(table);
}

/* =========================
   TABLE DATE
========================= */

function formatTableDate(key){

  const parts = key.split("-");

  if(parts.length !== 3){
    return key;
  }

  const y = Number(parts[0]);
  const m = Number(parts[1])-1;
  const d = Number(parts[2]);

  const date = new Date(y,m,d);

  return `${m+1}/${d}（${dayNames[date.getDay()]}）`;
}

/* =========================
   MOBILE
========================= */

function renderMobile(games){

  const main = document.getElementById("matches");

  const mobile =
    document.createElement("div");

  mobile.className =
    viewMode === "simple"
      ? "mobile-list mobile-simple"
      : "mobile-list";

  let currentLeague = "";

  const daySection =
    document.createElement("section");

  daySection.className = "mobile-day";

  const dayTitle =
    document.createElement("div");

  dayTitle.className =
    "mobile-day-title";

  dayTitle.textContent =
    formatDate(day);

  daySection.appendChild(dayTitle);

  games.forEach(g => {

    const league =
      g.league || "その他";

    if(league !== currentLeague){

      currentLeague = league;

      const leagueBlock =
        document.createElement("div");

      leagueBlock.className =
        "mobile-league";

      const leagueTitle =
        document.createElement("div");

      leagueTitle.className =
        "mobile-league-title";

      leagueTitle.textContent =
        league;

      leagueBlock.appendChild(
        leagueTitle
      );

      daySection.appendChild(
        leagueBlock
      );
    }

    const leagueBlock =
      daySection.lastElementChild;

    const card =
      document.createElement("div");

    card.className =
      "mobile-match";

    const time =
      document.createElement("div");

    time.className =
      "mobile-time";

    time.textContent =
      displayTime(g.timeJst);

    const teams =
      document.createElement("div");

    teams.className =
      "mobile-teams";

    const home =
      document.createElement("div");

    home.className =
      "mobile-team";

    home.textContent =
      g.homeNameJa || "";

    if(g.homeJp && g.homeJp.length){

      const jp =
        document.createElement("span");

      jp.className =
        "mobile-jp";

      jp.textContent =
        g.homeJp.join("・");

      home.appendChild(jp);
    }

    const vs =
      document.createElement("div");

    vs.className =
      "mobile-vs";

    vs.textContent =
      "vs";

    const away =
      document.createElement("div");

    away.className =
      "mobile-team";

    away.textContent =
      g.awayNameJa || "";

    if(g.awayJp && g.awayJp.length){

      const jp =
        document.createElement("span");

      jp.className =
        "mobile-jp";

      jp.textContent =
        g.awayJp.join("・");

      away.appendChild(jp);
    }

    teams.appendChild(home);
    teams.appendChild(vs);
    teams.appendChild(away);

    card.appendChild(time);
    card.appendChild(teams);

    leagueBlock.appendChild(card);
  });

  mobile.appendChild(daySection);

  main.appendChild(mobile);
}

/* =========================
   LOAD SCHEDULE
========================= */

async function loadSchedule(){

  const main =
    document.getElementById("matches");

  try{

    const response =
      await fetch(
        "./schedule.json?v=" + Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "schedule.json の読み込みに失敗しました"
      );
    }

    allMatches =
      await response.json();

    render();

  }catch(error){

    console.error(error);

    main.innerHTML =
      '<div class="empty">試合日程を読み込めませんでした。</div>';
  }
}

/* =========================
   DATE BUTTONS
========================= */

document.getElementById("prev").onclick = () => {

  day.setDate(
    day.getDate() - 1
  );

  render();
};

document.getElementById("next").onclick = () => {

  day.setDate(
    day.getDate() + 1
  );

  render();
};

/* =========================
   FILTER BUTTONS
========================= */

document.querySelectorAll(".filter")
.forEach(button => {

  button.onclick = () => {

    document
      .querySelectorAll(".filter")
      .forEach(x =>
        x.classList.remove("active")
      );

    button.classList.add("active");

    if(button.dataset.view){

      viewMode =
        button.dataset.view;

      /*
        簡素表示では
        JPフィルターを解除して
        全試合を表示
      */

      filter = "all";

    }else{

      filter =
        button.dataset.filter;

      viewMode = "normal";
    }

    render();
  };

});

loadSchedule();

</script>

</body>
</html>
