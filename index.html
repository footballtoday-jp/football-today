<style>
*{box-sizing:border-box}

body{

</style>
</head>

<body>

<div class="wrap">

<header>
  <div>
    <div class="logo">FOOTBALL TODAY</div>
    <div class="sub">海外サッカーを日本時間で</div>
  </div>
  <div class="sub">JP 日本人選手</div>
</header>

<div class="datebar">
  <button class="nav" id="prev">← 前日</button>
  <div class="date" id="date">読み込み中</div>
  <button class="nav" id="next">翌日 →</button>
</div>

<div class="filters">
  <button class="filter active" data-filter="all">すべて</button>
  <button class="filter" data-filter="jp">JP 日本人所属</button>
  <button class="filter" data-view="table">簡素表示</button>
</div>

<main id="matches">
  <div class="status">試合日程を読み込んでいます…</div>
</main>

<div class="note">
  ※ このサイトはネタバレ防止のため、スコア・勝敗・試合結果は表示しません。
  試合日時や所属は変更される場合があります。
</div>

</div>

<script>

let allMatches = [];
let day = new Date();
let filter = "all";
let viewMode = "normal";

const dayNames = ["日","月","火","水","木","金","土"];

function formatDate(d){
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${dayNames[d.getDay()]}）`;
}

function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

/* 25:30 → 01:30 のように24時間表記へ統一 */
function displayTime(time){

  if(!time) return "";

  const match =
    String(time).match(/^(\d{1,2}):(\d{2})$/);

  if(!match) return time;

  let hour = Number(match[1]);

  const minute = match[2];

  if(hour >= 24){
    hour = hour - 24;
  }

  return `${String(hour).padStart(2,"0")}:${minute}`;
}

/* 今日から10日間の日付 */
function getTableDates(){

  const dates = [];

  const start = new Date();

  start.setHours(0,0,0,0);

  for(let i=0;i<10;i++){

    const d = new Date(start);

    d.setDate(start.getDate()+i);

    dates.push(d);
  }

  return dates;
}

/* =========================
   通常表示
   ========================= */

function renderNormal(){

  document.body.classList.remove("table-active");

  document.getElementById("date").textContent =
    formatDate(day);

  const main =
    document.getElementById("matches");

  main.className = "";

  main.innerHTML = "";

  const key = dateKey(day);

  let games =
    allMatches.filter(m => m.dateJst === key);

  if(filter === "jp"){

    games = games.filter(m =>
      (m.homeJp && m.homeJp.length) ||
      (m.awayJp && m.awayJp.length)
    );
  }

  games.sort((a,b) =>
    String(a.timeJst || "").localeCompare(
      String(b.timeJst || "")
    )
  );

  if(!games.length){

    main.innerHTML =
      '<div class="empty">この日の対象試合はありません。</div>';

    return;
  }

  let currentLeague = "";

  games.forEach(g => {

    const league =
      g.league || "その他";

    if(league !== currentLeague){

      currentLeague = league;

      const section =
        document.createElement("section");

      section.className = "league";

      const title =
        document.createElement("div");

      title.className = "league-title";

      title.textContent = league;

      section.appendChild(title);

      main.appendChild(section);
    }

    const section =
      main.lastElementChild;

    const card =
      document.createElement("div");

    card.className = "match";

    const time =
      document.createElement("div");

    time.className = "time";

    time.textContent =
      displayTime(g.timeJst);

    const home =
      document.createElement("div");

    home.className = "team";

    const homeTag =
      document.createElement("span");

    homeTag.className = "league-tag";

    homeTag.textContent = league;

    home.appendChild(homeTag);

    const homeName =
      document.createElement("div");

    homeName.textContent =
      g.homeNameJa || "";

    home.appendChild(homeName);

    if(g.homeJp && g.homeJp.length){

      const jp =
        document.createElement("span");

      jp.className = "jp";

      jp.textContent =
        g.homeJp.join("・");

      home.appendChild(jp);
    }

    const away =
      document.createElement("div");

    away.className = "team";

    const awayTag =
      document.createElement("span");

    awayTag.className = "league-tag";

    awayTag.textContent = league;

    away.appendChild(awayTag);

    const awayName =
      document.createElement("div");

    awayName.textContent =
      g.awayNameJa || "";

    away.appendChild(awayName);

    if(g.awayJp && g.awayJp.length){

      const jp =
        document.createElement("span");

      jp.className = "jp";

      jp.textContent =
        g.awayJp.join("・");

      away.appendChild(jp);
    }

    card.appendChild(time);
    card.appendChild(home);
    card.appendChild(away);

    section.appendChild(card);
  });
}

/* =========================
   10日間一覧表示
   ========================= */

function renderTable(){

  document.body.classList.add("table-active");

  const main =
    document.getElementById("matches");

  main.className = "table-mode";

  main.innerHTML = "";

  const dates =
    getTableDates();

  const wrapper =
    document.createElement("div");

  wrapper.className = "table-wrap";

  const table =
    document.createElement("table");

  table.className = "schedule-table";

  const thead =
    document.createElement("thead");

  const header =
    document.createElement("tr");

  [
    "日付",
    "時刻",
    "リーグ",
    "ホーム",
    "日本人",
    "アウェイ",
    "日本人"
  ].forEach(text => {

    const th =
      document.createElement("th");

    th.textContent = text;

    header.appendChild(th);
  });

  thead.appendChild(header);

  table.appendChild(thead);

  const tbody =
    document.createElement("tbody");

  dates.forEach(date => {

    const key =
      dateKey(date);

    let games =
      allMatches.filter(
        m => m.dateJst === key
      );

    if(filter === "jp"){

      games = games.filter(m =>
        (m.homeJp && m.homeJp.length) ||
        (m.awayJp && m.awayJp.length)
      );
    }

    games.sort((a,b) =>
      String(a.timeJst || "").localeCompare(
        String(b.timeJst || "")
      )
    );

    games.forEach((g,index) => {

      const tr =
        document.createElement("tr");

      if(index === 0){
        tr.className = "date-start";
      }

      /* 日付は各日の最初の試合だけ表示 */
      const dateCell =
        document.createElement("td");

      dateCell.className = "date-cell";

      if(index === 0){

        dateCell.textContent =
          `${date.getMonth()+1}/${date.getDate()}（${dayNames[date.getDay()]}）`;
      }

      const timeCell =
        document.createElement("td");

      timeCell.className = "time-cell";

      timeCell.textContent =
        displayTime(g.timeJst);

      const leagueCell =
        document.createElement("td");

      leagueCell.className = "league-cell";

      leagueCell.textContent =
        g.league || "その他";

      const homeCell =
        document.createElement("td");

      homeCell.className = "team-cell";

      homeCell.textContent =
        g.homeNameJa || "";

      const homeJpCell =
        document.createElement("td");

      homeJpCell.className = "jp-cell";

      homeJpCell.textContent =
        g.homeJp && g.homeJp.length
        ? g.homeJp.join("・")
        : "";

      const awayCell =
        document.createElement("td");

      awayCell.className = "team-cell";

      awayCell.textContent =
        g.awayNameJa || "";

      const awayJpCell =
        document.createElement("td");

      awayJpCell.className = "jp-cell";

      awayJpCell.textContent =
        g.awayJp && g.awayJp.length
        ? g.awayJp.join("・")
        : "";

      tr.appendChild(dateCell);
      tr.appendChild(timeCell);
      tr.appendChild(leagueCell);
      tr.appendChild(homeCell);
      tr.appendChild(homeJpCell);
      tr.appendChild(awayCell);
      tr.appendChild(awayJpCell);

      tbody.appendChild(tr);
    });
  });

  if(!tbody.children.length){

    main.innerHTML =
      '<div class="empty">対象試合はありません。</div>';

    return;
  }

  table.appendChild(tbody);

  wrapper.appendChild(table);

  main.appendChild(wrapper);
}

/* =========================
   表示切り替え
   ========================= */

function render(){

  if(viewMode === "table"){

    document.getElementById("date").textContent =
      "今後10日間";

    renderTable();

  }else{

    renderNormal();
  }
}

/* =========================
   schedule.json 読み込み
   ========================= */

async function loadSchedule(){

  const main =
    document.getElementById("matches");

  try{

    const response =
      await fetch(
        "./schedule.json?v=" + Date.now(),
        {cache:"no-store"}
      );

    if(!response.ok){

      throw new Error(
        "schedule.json の読み込みに失敗しました"
      );
    }

    allMatches =
      await response.json();

    render();

  }catch(error){

    console.error(error);

    main.innerHTML =
      '<div class="empty">試合日程を読み込めませんでした。</div>';
  }
}

/* =========================
   前日・翌日
   ========================= */

document.getElementById("prev").onclick = () => {

  if(viewMode === "table") return;

  day.setDate(day.getDate() - 1);

  render();
};

document.getElementById("next").onclick = () => {

  if(viewMode === "table") return;

  day.setDate(day.getDate() + 1);

  render();
};

/* =========================
   フィルター・表示切り替え
   ========================= */

document.querySelectorAll(".filter").forEach(button => {

  button.onclick = () => {

    document.querySelectorAll(".filter")
      .forEach(x =>
        x.classList.remove("active")
      );

    button.classList.add("active");

    if(button.dataset.view){

      viewMode =
        button.dataset.view;

    }else{

      filter =
        button.dataset.filter;

      viewMode = "normal";
    }

    render();
  };
});

loadSchedule();

</script>

</body>
</html>
