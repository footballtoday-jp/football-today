  .wrap{
    padding:14px 8px 35px;
  }

  header{
    margin-bottom:12px;

  .logo{

  }

  }

    font-size:11px;
  }

  .mobile-jp{
    font-size:9px;
  }

  .mobile-vs{
    font-size:9px;
  }

  .mobile-league{

  .date{
    font-size:18px;

  }

  .mobile-teams{
    grid-template-columns:1fr 22px 1fr;
  }

    font-size:10px;

<body>

<div class="wrap">

<header>
  <div>
    <div class="logo">FOOTBALL TODAY</div>
    <div class="sub">海外サッカーを日本時間で</div>
  </div>

  <div class="sub">JP 日本人選手</div>
</header>


<div class="datebar">
  <button class="nav" id="prev">← 前の10日間</button>

  <div class="date" id="date">
    今後10日間
  </div>

  <button class="nav" id="next">次の10日間 →</button>
</div>


<div class="filters">

  <button class="filter active" data-filter="all">
    すべて
  </button>

  <button class="filter" data-filter="jp">
    JP 日本人所属
  </button>

  <button class="filter" data-view="simple">
    簡素表示
  </button>

</div>


<main id="matches">

  <div class="status">
    試合日程を読み込んでいます…
  </div>

</main>


<div class="note">
  ※ このサイトはネタバレ防止のため、スコア・勝敗・試合結果は表示しません。
  試合日時や所属は変更される場合があります。
</div>

</div>


<script>

let allMatches = [];

let startDay = new Date();

let filter = "all";

let viewMode = "normal";

const DAY_COUNT = 10;

const dayNames = [
  "日",
  "月",
  "火",
  "水",
  "木",
  "金",
  "土"
];


/* 日付を YYYY-MM-DD にする */

function dateKey(d){

  const y = d.getFullYear();

  const m = String(
    d.getMonth()+1
  ).padStart(2,"0");

  const day = String(
    d.getDate()
  ).padStart(2,"0");

  return `${y}-${m}-${day}`;
}


/* 日付表示 */

function formatDate(d){

  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${dayNames[d.getDay()]}）`;

}


/* 時刻を24時間表記に統一 */

function displayTime(time){

  if(!time){
    return "";
  }

  const match = String(time).match(
    /^(\d{1,2}):(\d{2})$/
  );

  if(!match){
    return time;
  }

  let hour = Number(match[1]);

  const minute = match[2];

  /*
    25:00 → 01:00
    26:30 → 02:30
    24:00 → 00:00
  */

  if(hour >= 24){
    hour = hour - 24;
  }

  return String(hour).padStart(2,"0") + ":" + minute;

}


/* 日本人選手 */

function jpText(players){

  if(!players || !players.length){
    return "";
  }

  return players.join("・");

}


/* 表示期間を作る */

function getDateList(){

  const list = [];

  for(let i=0; i<DAY_COUNT; i++){

    const d = new Date(startDay);

    d.setDate(
      startDay.getDate() + i
    );

    list.push(d);

  }

  return list;

}


/* 10日間の日付タイトル */

function updateDateTitle(){

  document.getElementById("date").textContent =
    "今後10日間";

}


/* 試合を取得 */

function getGamesForDay(key){

  let games = allMatches.filter(
    m => m.dateJst === key
  );

  if(filter === "jp"){

    games = games.filter(m =>
      (m.homeJp && m.homeJp.length) ||
      (m.awayJp && m.awayJp.length)
    );

  }

  games.sort((a,b) =>
    String(a.timeJst || "")
      .localeCompare(
        String(b.timeJst || "")
      )
  );

  return games;

}


/* PC表 */

function renderTable(){

  const dates = getDateList();

  let html = "";

  html += '<div class="table-wrap">';

  html += '<table class="schedule-table">';

  html += `
    <thead>
      <tr>
        <th>日付</th>
        <th>時刻</th>
        <th>リーグ</th>
        <th>ホーム</th>
        <th>日本人</th>
        <th>アウェイ</th>
        <th>日本人</th>
      </tr>
    </thead>
  `;

  html += "<tbody>";

  let total = 0;

  dates.forEach((d,index) => {

    const key = dateKey(d);

    const games = getGamesForDay(key);

    if(!games.length){
      return;
    }

    games.forEach((g,gameIndex) => {

      total++;

      const dateLabel =
        `${d.getMonth()+1}/${d.getDate()}（${dayNames[d.getDay()]}）`;

      html += `
        <tr class="${gameIndex === 0 ? "day-start" : ""}">

          <td class="date-cell">
            ${gameIndex === 0 ? dateLabel : ""}
          </td>

          <td class="time-cell">
            ${displayTime(g.timeJst)}
          </td>

          <td class="league-cell">
            ${g.league || ""}
          </td>

          <td class="team-cell">
            ${g.homeNameJa || ""}
          </td>

          <td class="jp-cell">
            ${jpText(g.homeJp)}
          </td>

          <td class="team-cell">
            ${g.awayNameJa || ""}
          </td>

          <td class="jp-cell">
            ${jpText(g.awayJp)}
          </td>

        </tr>
      `;

    });

  });

  html += "</tbody>";
  html += "</table>";
  html += "</div>";

  if(!total){

    return `
      <div class="empty">
        この10日間の対象試合はありません。
      </div>
    `;

  }

  return html;

}


/* スマホカード */

function renderMobile(){

  const dates = getDateList();

  let html = '<div class="mobile-list">';

  let total = 0;

  dates.forEach(d => {

    const key = dateKey(d);

    const games = getGamesForDay(key);

    if(!games.length){
      return;
    }

    total += games.length;

    const dateLabel =
      `${d.getMonth()+1}/${d.getDate()}（${dayNames[d.getDay()]}）`;

    html += `
      <section class="mobile-day">

        <div class="mobile-date">
          ${dateLabel}
        </div>
    `;


    games.forEach(g => {

      html += `

        <div class="mobile-match">

          <div class="mobile-league">
            ${g.league || ""}
          </div>

          <div class="mobile-time">
            ${displayTime(g.timeJst)}
          </div>

          <div class="mobile-teams">

            <div class="mobile-team">

              ${g.homeNameJa || ""}

              ${
                g.homeJp && g.homeJp.length
                ? `<span class="mobile-jp">${jpText(g.homeJp)}</span>`
                : ""
              }

            </div>

            <div class="mobile-vs">
              VS
            </div>

            <div class="mobile-team">

              ${g.awayNameJa || ""}

              ${
                g.awayJp && g.awayJp.length
                ? `<span class="mobile-jp">${jpText(g.awayJp)}</span>`
                : ""
              }

            </div>

          </div>

        </div>

      `;

    });

    html += "</section>";

  });

  html += "</div>";

  if(!total){

    return `
      <div class="empty">
        この10日間の対象試合はありません。
      </div>
    `;

  }

  return html;

}


/* 全体描画 */

function render(){

  updateDateTitle();

  const main =
    document.getElementById("matches");

  if(viewMode === "simple"){

    main.className = "simple-mode";

  }else{

    main.className = "";

  }

  main.innerHTML =
    renderTable() +
    renderMobile();

}


/* データ読み込み */

async function loadSchedule(){

  const main =
    document.getElementById("matches");

  try{

    const response = await fetch(
      "./schedule.json?v=" + Date.now(),
      {
        cache:"no-store"
      }
    );

    if(!response.ok){

      throw new Error(
        "schedule.json の読み込みに失敗しました"
      );

    }

    allMatches =
      await response.json();

    /*
      今日を10日間表示の開始日にする
    */

    const today =
      new Date();

    today.setHours(
      0,0,0,0
    );

    startDay = today;

    render();

  }catch(error){

    console.error(error);

    main.innerHTML =
      '<div class="empty">試合日程を読み込めませんでした。</div>';

  }

}


/* 前の10日間 */

document.getElementById("prev").onclick = () => {

  startDay.setDate(
    startDay.getDate() - DAY_COUNT
  );

  render();

};


/* 次の10日間 */

document.getElementById("next").onclick = () => {

  startDay.setDate(
    startDay.getDate() + DAY_COUNT
  );

  render();

};


/* フィルター */

document.querySelectorAll(".filter")
.forEach(button => {

  button.onclick = () => {

    document
      .querySelectorAll(".filter")
      .forEach(x =>
        x.classList.remove("active")
      );

    button.classList.add("active");


    if(button.dataset.view){

      viewMode =
        button.dataset.view;

    }else{

      filter =
        button.dataset.filter;

      viewMode =
        "normal";

    }

    render();

  };

});


loadSchedule();

</script>

</body>
</html>
