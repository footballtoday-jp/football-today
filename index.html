<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOOTBALL TODAY</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f6f6f4;
  color:#171717;
  font-family:Arial,"Noto Sans JP",sans-serif
}
.wrap{
  max-width:760px;
  margin:0 auto;
  padding:28px 18px 60px
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px
}
.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:.04em
}
.sub{
  font-size:12px;
  color:#777
}
.datebar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:14px
}
.date{
  font-size:24px;
  font-weight:800;
  text-align:center
}
.nav{
  border:0;
  background:0;
  font-size:14px;
  cursor:pointer;
  color:#555;
  padding:8px
}
.filters{
  display:flex;
  gap:8px;
  margin-bottom:22px
}
.filter{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:11px;
  cursor:pointer;
  font-weight:700
}
.filter.active{
  background:#171717;
  color:#fff;
  border-color:#171717
}
.league{
  margin:22px 0 0
}
.league-title{
  font-size:13px;
  font-weight:800;
  color:#666;
  margin:0 0 8px;
  padding-left:2px
}
.match{
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:13px;
  padding:15px;
  margin-bottom:8px;
  display:grid;
  grid-template-columns:90px 1fr 1fr;
  align-items:center;
  gap:10px
}

.simple-mode .match{
  grid-template-columns:70px 1fr 1fr;
}

.simple-mode .league-title{
  display:none;
}

.simple-mode .league-tag{
  display:none;
}
  
.time{
  font-size:16px;
  font-weight:800;
  align-self:start;
  padding-top:4px
}
.team{
  text-align:center;
  font-size:14px;
  line-height:1.35
}
.league-tag{
  display:block;
  font-size:9px;
  color:#999;
  font-weight:600;
  margin-bottom:4px
}
.jp{
  display:block;
  font-size:11px;
  color:#16734a;
  font-weight:700;
  margin-top:4px
}
.empty{
  background:#fff;
  border:1px dashed #ddd;
  border-radius:13px;
  padding:30px;
  text-align:center;
  color:#777
}
.note{
  font-size:11px;
  color:#777;
  line-height:1.7;
  margin-top:24px
}
.status{
  text-align:center;
  color:#777;
  padding:30px 10px
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div>
    <div class="logo">FOOTBALL TODAY</div>
    <div class="sub">海外サッカーを日本時間で</div>
  </div>
  <div class="sub">JP 日本人選手</div>
</header>

<div class="datebar">
  <button class="nav" id="prev">← 前日</button>
  <div class="date" id="date">読み込み中</div>
  <button class="nav" id="next">翌日 →</button>
</div>

<div class="filters">
  <button class="filter active" data-filter="all">すべて</button>
  <button class="filter" data-filter="jp">JP 日本人所属</button>
  <button class="filter" data-view="simple">簡素表示</button>
</div>

<main id="matches">
  <div class="status">試合日程を読み込んでいます…</div>
</main>

<div class="note">
  ※ このサイトはネタバレ防止のため、スコア・勝敗・試合結果は表示しません。
  試合日時や所属は変更される場合があります。
</div>

</div>

<script>
let allMatches = [];
let day = new Date();
let filter = "all";
let viewMode = "normal";

const dayNames = ["日","月","火","水","木","金","土"];

function formatDate(d){
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${dayNames[d.getDay()]}）`;
}

function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function displayTime(time){
  if(!time) return "";
  return time;
}

function render(){

  document.getElementById("date").textContent = formatDate(day);

  const key = dateKey(day);
  const main = document.getElementById("matches");

  main.className = viewMode === "simple" ? "simple-mode" : "";
  
  main.innerHTML = "";

  let games = allMatches.filter(m => m.dateJst === key);

  if(filter === "jp"){
    games = games.filter(m =>
      (m.homeJp && m.homeJp.length) ||
      (m.awayJp && m.awayJp.length)
    );
  }

  games.sort((a,b) =>
    String(a.timeJst || "").localeCompare(
      String(b.timeJst || "")
    )
  );

  if(!games.length){
    main.innerHTML =
      '<div class="empty">この日の対象試合はありません。</div>';
    return;
  }

  let currentLeague = "";

  games.forEach(g => {

    const league = g.league || "その他";

    if(league !== currentLeague){
      currentLeague = league;

      const section = document.createElement("section");
      section.className = "league";

      const title = document.createElement("div");
     title.className = "league-title";
     title.textContent = league;

if(viewMode !== "simple"){
  section.appendChild(title);
}

main.appendChild(section);
    }

    const section =
      main.lastElementChild;

    const card = document.createElement("div");
    card.className = "match";

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = displayTime(g.timeJst);

    const home = document.createElement("div");
    home.className = "team";

    const homeTag = document.createElement("span");
    homeTag.className = "league-tag";
    homeTag.textContent = league;

if(viewMode !== "simple"){
  home.appendChild(homeTag);
}

    const homeName = document.createElement("div");
    homeName.textContent = g.homeNameJa || "";
    home.appendChild(homeName);

    if(g.homeJp && g.homeJp.length){
      const jp = document.createElement("span");
      jp.className = "jp";
      jp.textContent = g.homeJp.join("・");
      home.appendChild(jp);
    }

    const away = document.createElement("div");
    away.className = "team";

    const awayTag = document.createElement("span");
   awayTag.className = "league-tag";
   awayTag.textContent = league;

if(viewMode !== "simple"){
   away.appendChild(awayTag);
}
    const awayName = document.createElement("div");
    awayName.textContent = g.awayNameJa || "";
    away.appendChild(awayName);

    if(g.awayJp && g.awayJp.length){
      const jp = document.createElement("span");
      jp.className = "jp";
      jp.textContent = g.awayJp.join("・");
      away.appendChild(jp);
    }

    card.appendChild(time);
    card.appendChild(home);
    card.appendChild(away);

    section.appendChild(card);
  });
}

async function loadSchedule(){

  const main = document.getElementById("matches");

  try{

    const response = await fetch(
      "./schedule.json?v=" + Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("schedule.json の読み込みに失敗しました");
    }

    allMatches = await response.json();

    render();

  }catch(error){

    console.error(error);

    main.innerHTML =
      '<div class="empty">試合日程を読み込めませんでした。</div>';
  }
}

document.getElementById("prev").onclick = () => {
  day.setDate(day.getDate() - 1);
  render();
};

document.getElementById("next").onclick = () => {
  day.setDate(day.getDate() + 1);
  render();
};

document.querySelectorAll(".filter").forEach(button => {

  button.onclick = () => {

    document.querySelectorAll(".filter")
      .forEach(x => x.classList.remove("active"));

    button.classList.add("active");

    if(button.dataset.view){
      viewMode = button.dataset.view;
    }else{
      filter = button.dataset.filter;
      viewMode = "normal";
    }

    render();
  };

});

loadSchedule();
</script>

</body>
</html>
